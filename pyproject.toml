[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-mentor"
version = "0.1.0"
description = "Private Phase 1 intelligence proof for Theo's AI Trading Mentor"
requires-python = ">=3.12"
dependencies = ["openai>=2,<3", "pandas==3.0.5", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
