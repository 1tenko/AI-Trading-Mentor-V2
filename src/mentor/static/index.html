<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Theo's Trading Mentor</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Conversations"><div class="brand">Theo's Trading Mentor</div><button class="new-thread" id="new-thread" type="button">+ New conversation</button><nav id="threads" aria-label="Saved conversations"></nav></aside>
      <main class="chat" aria-label="Mentor conversation">
        <header class="chat-header"><div class="header-content"><div><h1>Jacob Speculates mentor</h1><p class="subtitle">Private, source-grounded Trading Mentor</p></div><div class="controls" role="group" aria-label="Research and reasoning controls"><label>Research<select id="research-depth"><option value="auto">Auto</option><option value="normal">Normal</option><option value="deep">Deep</option><option value="exhaustive">Exhaustive</option></select></label><label>Effort<select id="reasoning-effort"><option value="high">High</option><option value="xhigh">XHigh</option><option value="max">Max</option></select></label><label>Mode<select id="reasoning-mode"><option value="standard">Standard</option><option value="pro">Pro</option></select></label><button class="profile-toggle" id="profile-toggle" type="button" aria-controls="profile-panel" aria-expanded="false">Trader Profile</button></div></div></header>
        <div class="conversation" id="messages" aria-live="polite"><p class="empty">Ask a question to start a private, source-grounded evaluation.</p></div>
        <div class="composer-wrap"><form class="composer" id="question-form"><label for="question" class="subtitle">Ask about Jacob's trading teaching</label><textarea id="question" required maxlength="8000" placeholder="Ask a specific trading question…"></textarea><div class="composer-footer"><p id="status" role="status"></p><button class="send" type="submit">Send</button></div></form></div>
      </main>
      <div class="profile-backdrop" id="profile-backdrop" hidden></div>
      <aside class="profile-panel" id="profile-panel" role="dialog" aria-modal="true" aria-labelledby="profile-title" aria-describedby="profile-status" tabindex="-1" hidden>
        <header class="profile-header"><div><h2 id="profile-title">Trader Profile</h2><p class="subtitle">Local, editable user context. Not source evidence.</p></div><button id="profile-close" type="button" aria-label="Close Trader Profile">Close</button></header>
        <p id="profile-status" role="status" class="profile-status"></p>
        <form id="profile-add-form" class="profile-add-form"><h3>Add profile item</h3><label>Category<select name="category"><option value="goals/research">Goals / research</option><option value="markets/instruments">Markets / instruments</option><option value="schedule/horizon">Schedule / horizon</option><option value="style/methodology">Style / methodology</option><option value="execution/risk/constraints">Execution / risk</option><option value="experience/learning">Experience / learning</option><option value="preferences/discretion">Preferences / discretion</option><option value="strengths/difficulties/principles">Strengths / difficulties / principles</option></select></label><label>Subject<input name="subject" required maxlength="120" placeholder="e.g. Available session"></label><label>Value<input name="value" required maxlength="500" placeholder="e.g. London open"></label><label>Kind<select name="kind"><option value="fact">Fact</option><option value="preference">Preference</option><option value="constraint">Constraint</option><option value="goal">Goal</option><option value="principle">Principle</option><option value="learning-state">Learning state</option></select></label><label>Provenance<select name="provenance"><option value="USER_STATED">You stated this</option><option value="USER_DECISION">Your decision</option></select></label><button type="submit">Add item</button></form>
        <section class="profile-section" aria-labelledby="profile-current-title"><h3 id="profile-current-title">Current profile</h3><div id="profile-current"></div></section>
        <section class="profile-section" aria-labelledby="profile-tentative-title"><h3 id="profile-tentative-title">Needs confirmation</h3><div id="profile-tentative"></div></section>
        <details class="profile-history"><summary>History and conflicts</summary><div id="profile-history"></div><div id="profile-conflicts"></div></details>
      </aside>
    </div>
    <script src="/vendor/purify.min.js"></script><script type="module" src="/app.js"></script>
  </body>
</html>
