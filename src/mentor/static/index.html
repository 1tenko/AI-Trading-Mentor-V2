<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Theo's Trading Mentor</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Conversations"><div class="brand">Theo's Trading Mentor</div><button class="new-thread" id="new-thread" type="button">+ New conversation</button><nav id="threads" aria-label="Saved conversations"></nav></aside>
      <main class="chat" aria-label="Mentor conversation">
        <header class="chat-header"><div class="header-content"><div><h1>Jacob Speculates mentor</h1><p class="subtitle">Private, source-grounded Trading Mentor</p></div><div class="controls" role="group" aria-label="Research and reasoning controls"><label>Research<select id="research-depth"><option value="auto">Auto</option><option value="normal">Normal</option><option value="deep">Deep</option><option value="exhaustive">Exhaustive</option></select></label><label>Effort<select id="reasoning-effort"><option value="high">High</option><option value="xhigh">XHigh</option><option value="max">Max</option></select></label><label>Mode<select id="reasoning-mode"><option value="standard">Standard</option><option value="pro">Pro</option></select></label><button class="profile-chat-link data-toggle" id="data-toggle" type="button" aria-expanded="false">Data</button><span id="data-scope" class="data-scope">No conversation data</span><a class="profile-chat-link" href="/profile">Trader Profile</a></div></div></header>
        <section class="data-workspace" id="data-workspace" hidden aria-label="Backtest data workspace">
          <div class="data-workspace-head"><div><h2>Backtest data</h2><p>Local only. Confirm a mapping before selecting data for this conversation.</p></div><button id="data-close" type="button" aria-label="Close data workspace">Close</button></div>
          <form id="dataset-upload-form" class="data-upload"><label>Import CSV or XLSX<input id="dataset-file" type="file" accept=".csv,.xlsx" required></label><button type="submit">Import locally</button></form>
          <p id="data-status" role="status"></p>
          <div class="data-selection"><label>Dataset<select id="dataset-select"><option value="">Choose imported data</option></select></label><button id="dataset-inspect" type="button">Inspect &amp; map</button><button id="dataset-use" type="button">Use in this conversation</button><button id="dataset-clear" type="button">Clear conversation data</button></div>
          <div id="dataset-inspection"></div>
        </section>
        <div class="conversation" id="messages" aria-live="polite"><p class="empty">Ask a question to start a private, source-grounded evaluation.</p></div>
        <div class="composer-wrap"><form class="composer" id="question-form"><label for="question" class="subtitle">Ask about Jacob's trading teaching</label><textarea id="question" required maxlength="8000" placeholder="Ask a specific trading question…"></textarea><label class="qualitative-consent"><input id="include-approved-notes" type="checkbox"> Include approved notes in this answer <span>(local data is read once for this turn)</span></label><div class="composer-footer"><p id="status" role="status"></p><button class="send" type="submit">Send</button></div></form></div>
      </main>
    </div>
    <script src="/vendor/purify.min.js"></script><script type="module" src="/app.js"></script>
  </body>
</html>
